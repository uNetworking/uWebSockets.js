name: Benchmark

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      base:
        description: 'Ref to compare this branch against'
        default: master

permissions:
  contents: read

jobs:
  benchmark:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # the comment on the pull request. Read-only on a pull request from a fork, where the
      # job summary is the only output
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || inputs.base }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk
      # build.c does not fail on a compiler error, so the check is loading what it produced
      - name: Build both arms
        run: |
          for arm in base head; do
            (cd $arm && make > ../$arm-build.log 2>&1) &
          done
          wait
          for arm in base head; do
            node -e "require('./$arm/dist/uws.js')" || { cat $arm-build.log; exit 1; }
          done
      # the ws load generator of the uWebSockets repo, as its Makefile builds it
      - name: Build load_test
        working-directory: head/uWebSockets/benchmarks
        run: |
          clang-18 -O3 -DLIBUS_USE_OPENSSL -I../uSockets/src ../uSockets/src/*.c ../uSockets/src/eventing/*.c ../uSockets/src/crypto/*.c load_test.c -c
          clang++-18 -O3 -DLIBUS_USE_OPENSSL -I../uSockets/src ../uSockets/src/crypto/*.cpp -c -std=c++17
          clang++-18 -O3 *.o -lssl -lcrypto -lz -o load_test
      - name: Run benchmark
        working-directory: head
        run: node benchmark/compare.js --base ../base --head . --rounds 4 --duration 3 --output ../benchmark_summary.md
      - name: Publish the summary
        run: cat benchmark_summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: benchmark_summary.md
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- benchmark-comment -->';
            const body = fs.readFileSync('benchmark_summary.md', 'utf8');
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }
