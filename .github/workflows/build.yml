name: Build
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Setup Windows
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup NASM for Windows
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.2.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Update binaries
        run: |
          git clone --recursive https://github.com/uNetworking/uWebSockets.js.git
          cd uWebSockets.js
          ${{ matrix.os == 'windows-latest' && 'nmake' || 'make' }}
          ls dist
          cd tests && npm install ws && node smoke.js && node strings.js && node esm.mjs && cd ..
          ls dist
          git fetch origin binaries:binaries
          git checkout binaries
          cp dist/*.node .
          cp dist/*.js .
          cp dist/*.mjs .
          # commit -a takes only files the branch already has
          git add index.js index.mjs
          git rev-parse master > source_commit
          ls
          ${{ matrix.os != 'windows-latest' && 'git checkout master docs/index.d.ts && mv docs/index.d.ts .' || '' }}
          git status
          git config --global user.email "alexhultman@gmail.com"
          git config --global user.name "Alex Hultman"
          git commit -a -m "[GitHub Actions] Updated ${{ matrix.os }} binaries" || true
          # Another job can push in between: then its commit is taken and the push tried again, up to three
          # times. One line, because PowerShell and bash both read && and || left to right. -X theirs keeps
          # this job's version of a file both changed, like source_commit
          git remote set-url --push origin "https://unetworkingab:${{ secrets.SECRET }}@github.com/uNetworking/uWebSockets.js"
          git push origin binaries || git pull --rebase -X theirs origin binaries && git push origin binaries || git pull --rebase -X theirs origin binaries && git push origin binaries || git pull --rebase -X theirs origin binaries && git push origin binaries
